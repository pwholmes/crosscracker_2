<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CrossCracker 2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1 id="page-title">CrossCracker 2</h1>
  
  <div id="controls">
    <div class="mode-toggle-container">
      <span class="mode-label">Puzzles</span>
      <label class="toggle-switch">
        <input type="checkbox" id="mode-toggle">
        <span class="toggle-slider"></span>
      </label>
      <span class="mode-label">Recordings</span>
    </div>
    
    <label for="item-select" id="item-select-label">Puzzle:</label>
    <select id="item-select"></select>
    
    <button id="play">Play ▶️</button>
    <button id="pause">Pause ⏸️</button>
    <button id="step">Step ➡️</button>
    <button id="reset">Reset 🔄</button>
    <button id="save-checkpoint" title="Save checkpoint">💾</button>
    <button id="load-checkpoint" title="Load checkpoint">📂</button>
  </div>

  <!-- Save Checkpoint Modal -->
  <div id="save-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <h3>Save Checkpoint</h3>
      <input type="text" id="checkpoint-name" placeholder="Checkpoint name (optional)" style="width: 100%; margin-bottom: 10px;">
      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button id="save-modal-cancel">Cancel</button>
        <button id="save-modal-confirm">Save</button>
      </div>
    </div>
  </div>

  <!-- Load Checkpoint Modal -->
  <div id="load-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <h3>Load Checkpoint</h3>
      <div id="checkpoint-list" style="max-height: 300px; overflow-y: auto; margin-bottom: 10px;"></div>
      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button id="load-modal-cancel">Cancel</button>
      </div>
    </div>
  </div>
  
  <!-- Replay speed control (hidden by default, shown when in replay mode) -->
  <div id="replay-speed-control">
    <label for="replay-speed">Speed: </label>
    <input type="range" id="replay-speed" min="0.25" max="3" step="0.25" value="1" style="width: 150px;">
    <span id="speed-label">1x</span>
    <span style="margin-left: 20px;">Step: <span id="current-step">0</span> / <span id="total-steps">0</span></span>
  </div>

  <div id="main">
    <div class="clue-column">
      <h3>Across</h3>
      <ul id="entries-across"></ul>
    </div>
    <div id="grid-section">
      <div id="status-progress-row" style="display: flex; align-items: center; gap: 16px;">
        <h3 id="status-message" style="margin-bottom: 0;">Select a puzzle</h3>
        <button id="save-solution" style="display: none;">Save Solution</button>
        <div id="init-progress" style="display: none;">
          <div id="progress-bar-container">
            <div id="progress-bar-fill"></div>
            <span id="progress-text">0 / 0 entries</span>
          </div>
        </div>
      </div>
      <div id="grid-container"></div>
      <div id="tally">
        Steps: <span id="step-count">0</span>
        <span class="tally-sep">|</span>
        Backtracks: <span id="backtrack-count">0</span>
        <span class="tally-sep">|</span>
        Fallbacks: <span id="fallback-count">0</span>
        <span class="tally-sep">|</span>
        Incorrect: <span id="incorrect-count">0</span>
      </div>
    </div>
    <div class="clue-column">
      <h3>Down</h3>
      <ul id="entries-down"></ul>
    </div>
  </div>

  <div id="log-section">
    <h3 id="log-header" style="cursor: pointer;">Log <span id="log-toggle">▶</span></h3>
    <pre id="log" style="display: none;"></pre>
  </div>

  <script src="app.js"></script>
</body>
</html>
